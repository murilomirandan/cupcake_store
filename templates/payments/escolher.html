{% extends 'base.html' %}
{% block title %}Forma de Pagamento{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <h1 class="mb-4">💳 Forma de Pagamento</h1>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <p class="mb-1 text-muted">Pedido</p>
                <h4 class="mb-0">{{ pedido.numeroPedido }}</h4>
                <hr>
                <p class="mb-1 text-muted">Total a pagar</p>
                <h3 class="text-success">R$ {{ pedido.total }}</h3>
            </div>
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="form-check card p-3 mb-2 shadow-sm opcao-pagamento">
                <input class="form-check-input" type="radio" name="forma" value="CARTAO_CREDITO" id="cc" checked>
                <label class="form-check-label w-100" for="cc">
                    <strong>💳 Cartão de Crédito</strong>
                    <div class="small text-muted">Parcele em até 3x sem juros</div>
                </label>
            </div>

            <div class="form-check card p-3 mb-2 shadow-sm opcao-pagamento">
                <input class="form-check-input" type="radio" name="forma" value="CARTAO_DEBITO" id="cd">
                <label class="form-check-label w-100" for="cd">
                    <strong>💳 Cartão de Débito</strong>
                    <div class="small text-muted">Aprovação imediata</div>
                </label>
            </div>

            <div class="form-check card p-3 mb-4 shadow-sm opcao-pagamento">
                <input class="form-check-input" type="radio" name="forma" value="PIX" id="pix">
                <label class="form-check-label w-100" for="pix">
                    <strong>📱 PIX</strong>
                    <div class="small text-muted">Pagamento instantâneo</div>
                </label>
            </div>

            <div class="d-grid">
                <button class="btn btn-primary btn-lg">Continuar →</button>
            </div>
        </form>

        <a href="{% url 'orders:meus_pedidos' %}" class="btn btn-link mt-3">Cancelar</a>
    </div>
</div>

<style>
    .opcao-pagamento {
        cursor: pointer;
        transition: border-color .2s, transform .2s;
    }

    .opcao-pagamento:hover {
        border-color: #d63384;
        transform: translateY(-2px);
    }

    .opcao-pagamento input:checked~label strong {
        color: #d63384;
    }
</style>
{% endblock %}
