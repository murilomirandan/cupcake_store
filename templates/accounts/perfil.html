{% extends 'base.html' %}
{% block title %}Meu Perfil{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <div style="font-size: 4rem;">👤</div>
                    <h3 class="fw-bold mb-1">{{ user.nome }}</h3>
                    <p class="text-muted mb-0">{{ user.email }}</p>
                </div>
                <hr>
                <p><strong>CPF:</strong> {{ user.cpf|default:"—" }}</p>
                <p><strong>Membro desde:</strong> {{ user.data_cadastro|date:"d/m/Y" }}</p>
                <div class="d-grid gap-2 mt-4">
                    <a href="{% url 'accounts:enderecos' %}" class="btn btn-outline-primary">
                        📍 Meus Endereços
                    </a>
                    <a href="{% url 'orders:meus_pedidos' %}" class="btn btn-outline-primary">
                        📦 Meus Pedidos
                    </a>
                    <a href="{% url 'accounts:logout' %}" class="btn btn-outline-danger">
                        Sair
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
